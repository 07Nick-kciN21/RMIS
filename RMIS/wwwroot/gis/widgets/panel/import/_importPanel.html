<!-- @*  匯入圖資 *@ -->
<div id="importPanel" class="panel hide">
    <div class="panelHeading">
        <span>
            匯入圖資
        </span>
        <button class="closeButton">&times;</button>
    </div>
    <div class="panelBody">
        <label>支援格式</label>
        <ul>
            <li>-shapefile（ZIP壓縮文件需包含.shp及.dbf檔案及TWD97坐標，檔案大小限制為10MB）<a href="/TYMaintain/Doc/%e5%8d%97%e6%8a%95%e7%b8%a3%e4%bf%a1%e7%be%a9%e9%84%89.zip" download="">範例文件</a></li>
            <li>-kml/kmz檔案(檔案大小限制為10MB)<a href="javascript:void(0)" onclick="downloadFile('/TYMaintain/Doc/20090329.kmz','檔案.kmz')">範例文件</a></li>
            <li>-gpx檔案（GPS軌跡記錄檔）<a href="javascript:void(0)" onclick="downloadFile('/TYMaintain/Doc/範例文件.gpx','範例文件.gpx')">範例文件</a></li>
            <li>-csv檔案（TWD97坐標或WGS84坐標值）<a href="/TYMaintain/Doc/TWD97_%e7%af%84%e4%be%8b%e6%96%87%e4%bb%b6.csv" download="">範例文件</a></li>
        </ul>
        <div>
            <label>上傳圖資</label>
            <div id="selectFile" class="btn" onclick="document.getElementById('inFile').click();">選擇檔案</div>
            <form enctype="multipart/form-data" method="post" id="uploadForm" style="display: none;">
                <div class="field">
                    <label class="file-upload">
                        <input id="inFile" type="file" name="file">
                    </label>
                </div>
            </form>
            <span id="selFileResult">未選擇檔案</span>
            <div id="selFileNotice" class="noticeText visibleHide">無法加入文件，請注意支援格式</div>
        </div>
        
        <div id="gpxOpt" class="displayNone">
            
            <label class="inline-block">圖層：</label>
            <select id="gpxLayerIdx" class="inline-block" style="width:220px;" name="gpxIndex">
                <option value="0" selected="">重要地點</option>
                <option value="1">行進軌跡線</option>
                <option value="2">軌跡線的坐標點</option>
            </select>
        </div>
        
        
        <div id="shpOpt" class="displayNone">
            <label class="inline-block">圖層：</label><input id="shpLayerIdx" class="inline-block" type="text" style="width:30px;text-align:center" value="0">
        </div>
        
        
        <div id="csvOpt" class="displayNone">
            <div class="fieldset-radio">
                <label class="inline-block">
                    <input type="radio" name="cvsGeo" value="point" checked="">點
                </label>
                <label class="inline-block">
                    <input type="radio" name="cvsGeo" value="line">線
                </label>
                <label class="inline-block">
                    <input type="radio" name="cvsGeo" value="area">面
                </label>
            </div>
            <label>
                <input id="chkShowFirst" type="checkbox"> 顯示第一點坐標
            </label>
        </div>
    </div>
</div>
